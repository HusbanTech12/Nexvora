[project]
name = "backend"
version = "0.1.0"
description = "Nexvora Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "resend>=0.20.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "google-generativeai>=0.8.0",
    "google-api-python-client>=2.150.0",
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
