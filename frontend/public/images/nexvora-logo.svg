<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Icon mark -->
  <g transform="translate(40, 22)">
    <!-- Diamond glow -->
    <path d="M 50 12 L 100 62 L 50 112 L 0 62 Z" fill="url(#g1)" opacity="0.06"/>

    <!-- Diamond outline -->
    <path d="M 50 8 L 96 54 L 50 100 L 4 54 Z" stroke="url(#g1)" stroke-width="2.5" fill="none" opacity="0.5"/>

    <!-- Left stem of N -->
    <line x1="30" y1="32" x2="34" y2="78" stroke="#3B82F6" stroke-width="7" stroke-linecap="round"/>

    <!-- Diagonal of N -->
    <line x1="40" y1="28" x2="66" y2="82" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>

    <!-- Right stem of N -->
    <line x1="70" y1="32" x2="66" y2="78" stroke="#8B5CF6" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Wordmark: Nexvora -->
  <text x="170" y="98" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="54" font-weight="750" fill="white" letter-spacing="-0.5">Nexvora</text>

  <!-- Tagline: Creative Agency -->
  <text x="172" y="132" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#A1A1AA" letter-spacing="4.5">
    <tspan fill="url(#g2)">//</tspan>
    <tspan fill="#A1A1AA" dx="8">CREATIVE AGENCY</tspan>
  </text>
</svg>
