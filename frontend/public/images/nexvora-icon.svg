<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="200" y2="200">
      <stop stop-color="#7c3aed"/>
      <stop offset="0.3" stop-color="#a855f7"/>
      <stop offset="0.6" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="200" y2="200">
      <stop stop-color="#7c3aed" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#a855f7" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="200">
      <stop stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ambient-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="beam-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient purple haze -->
  <path
    d="M100 14L174 56V144L100 186L26 144V56Z"
    stroke="#a855f7"
    stroke-width="4"
    stroke-opacity="0.12"
    filter="url(#ambient-glow)"
  />

  <!-- Outer glass hexagon -->
  <path
    d="M100 14L174 56V144L100 186L26 144V56Z"
    fill="url(#glass)"
    stroke="url(#brand)"
    stroke-width="1.5"
  />

  <!-- Inner depth ring -->
  <path
    d="M100 28L166 64V136L100 172L34 136V64Z"
    fill="none"
    stroke="url(#brand)"
    stroke-width="0.75"
    stroke-opacity="0.25"
  />

  <!-- Corner signal arcs -->
  <path d="M26 56L46 66" stroke="url(#brand)" stroke-width="0.75" stroke-opacity="0.3"/>
  <path d="M174 56L154 66" stroke="url(#brand)" stroke-width="0.75" stroke-opacity="0.3"/>
  <path d="M174 144L154 134" stroke="url(#brand)" stroke-width="0.75" stroke-opacity="0.3"/>
  <path d="M26 144L46 134" stroke="url(#brand)" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- Shine overlay -->
  <path
    d="M100 14L174 56V144L100 186L26 144V56Z"
    fill="url(#shine)"
  />

  <!-- N beam outer glow -->
  <path
    d="M54 150V50L146 150V50"
    stroke="#a855f7"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.15"
    filter="url(#ambient-glow)"
  />

  <!-- N beam main stroke -->
  <path
    d="M54 150V50L146 150V50"
    stroke="url(#brand)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#beam-glow)"
  />

  <!-- N beam energy core -->
  <path
    d="M56 148V52L144 148V52"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.15"
  />

  <!-- Neural nodes -->
  <g filter="url(#node-glow)">
    <circle cx="54" cy="50" r="5" fill="url(#brand)"/>
    <circle cx="54" cy="150" r="5" fill="url(#brand)"/>
    <circle cx="146" cy="50" r="5" fill="url(#brand)"/>
  </g>

  <!-- Node core highlights -->
  <circle cx="54" cy="50" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="54" cy="150" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="146" cy="50" r="2" fill="#ffffff" opacity="0.5"/>

  <!-- Signature teal node (bottom-right) -->
  <circle cx="146" cy="150" r="7" fill="#14b8a6" filter="url(#node-glow)"/>
  <circle cx="146" cy="150" r="2.5" fill="#ffffff" opacity="0.6"/>

  <!-- Orbital arc around signature node -->
  <path
    d="M159 150A13 13 0 0 1 146 163"
    stroke="#14b8a6"
    stroke-width="1"
    stroke-opacity="0.35"
    fill="none"
    filter="url(#node-glow)"
  />
</svg>
